<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Nitro – Free 3 Months</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gift-card">
        <div class="card-header">
            <div class="nitro-icon glow">
                <span>🎁</span>
            </div>
            <h1>Nitro for free</h1>
            <div class="badge">Limited · 3 months included</div>
        </div>
        <div class="card-body">
            <div class="perk-list">
                <div class="perk"><span class="emoji">✨</span> Custom emojis anywhere</div>
                <div class="perk"><span class="emoji">🎮</span> Boost 2 servers</div>
                <div class="perk"><span class="emoji">🎥</span> HD streaming (source)</div>
                <div class="perk"><span class="emoji">📁</span> 100MB file uploads</div>
            </div>
            <div class="divider"></div>
            <button id="claimButton" class="claim-btn">
                <span>💎</span> Claim 3 months
                <span>→</span>
            </button>
            <div class="footer-note">
                Only for verified Discord users · Expires in 48h
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
